<div id="mqtt-widget-container">

<style>
#mqtt-widget-container{
  font-family: Arial, sans-serif;
  max-width: 420px;
  border:1px solid #ccc;
  border-radius:10px;
  padding:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  background:#fff;
  position:relative;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

#statusDot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:red;
}

#btnSetting{
  font-size:18px;
  cursor:pointer;
  border:none;
  background:none;
}

#messages{
  background:#f9f9f9;
  border:1px solid #ddd;
  padding:8px;
  min-height:120px;
  font-size:40px;
  margin-top:10px;
  overflow-y:auto;
}

#settingsPanel{
  display:none;
  position:absolute;
  top:40px;
  right:10px;
  width:280px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  padding:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  z-index:999;
}

.setting-section{
  border:1px solid #ddd;
  border-radius:6px;
  margin-bottom:10px;
  overflow:hidden;
}

.section-header{
  background:#f1f1f1;
  padding:8px;
  cursor:pointer;
  font-weight:bold;
}

.section-content{
  display:none;
  padding:8px;
}

.section-content.active{
  display:block;
}

#settingsPanel input,
#settingsPanel select,
#settingsPanel button{
  width:100%;
  margin-bottom:8px;
  padding:6px;
  box-sizing:border-box;
}
</style>

<div class="header">
  <div id="statusDot"></div>
  <button id="btnSetting">⚙</button>
</div>

<div id="messages">Waiting data...</div>

<div id="settingsPanel">

<!-- CONFIG -->
<div class="setting-section">
  <div class="section-header" onclick="toggleSection(this)">
    Broker Config
  </div>
  <div class="section-content active">

    Protocol:
    <select id="protocol">
      <option value="wss">wss</option>
      <option value="ws">ws</option>
    </select>

    Broker:
    <input type="text" id="broker" value="broker.emqx.io">

    Port:
    <input type="text" id="port" value="8084">

    Path:
    <input type="text" id="path" value="/mqtt">

    <button onclick="connectMQTT()">Connect</button>

  </div>
</div>

<!-- SUBSCRIBE -->
<div class="setting-section">
  <div class="section-header" onclick="toggleSection(this)">
    Subscribe
  </div>
  <div class="section-content">

    Topic:
    <input type="text" id="subtopic" value="fromEspZay">

    <button onclick="subscribeTopic()">Subscribe</button>

  </div>
</div>

<!-- PUBLISH -->
<div class="setting-section">
  <div class="section-header" onclick="toggleSection(this)">
    Publish
  </div>
  <div class="section-content">

    Topic:
    <input type="text" id="pubtopic" value="toEspZay">

    Message:
    <input type="text" id="message" placeholder="hello mqtt">

    <button onclick="publishMessage()">Send</button>

  </div>
</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

<script>

let client=null;
let connected=false;

function setStatus(state){
  document.getElementById("statusDot").style.background=
    state ? "green" : "red";
}

function logMessage(msg){
  document.getElementById("messages").innerHTML=msg;
}

document.getElementById("btnSetting").onclick=function(){
  const panel=document.getElementById("settingsPanel");
  panel.style.display = panel.style.display==="block" ? "none":"block";
}

function toggleSection(header){
  header.nextElementSibling.classList.toggle("active");
}

function connectMQTT(){

  const protocol=document.getElementById("protocol").value;
  const broker=document.getElementById("broker").value;
  const port=parseInt(document.getElementById("port").value);
  const path=document.getElementById("path").value;

  const fullURL=protocol+"://"+broker+":"+port+path;

  client=new Paho.MQTT.Client(
      fullURL,
      "web_"+Math.floor(Math.random()*10000)
  );

  client.onConnectionLost=function(){
    connected=false;
    setStatus(false);
    logMessage("Connection Lost");
    setTimeout(connectMQTT,1000);
    setTimeout(subscribeTopic,5000);
  }

  client.onMessageArrived=function(message){
    logMessage("RX: "+message.payloadString);
  }

  client.connect({
    useSSL:(protocol==="wss"),
    onSuccess:function(){
      connected=true;
      setStatus(true);
      logMessage("Connected");
    },
    onFailure:function(){
      connected=false;
      setStatus(false);
      logMessage("Connection Failed");
    }
  });
}

function subscribeTopic(){
  if(!connected){
    alert("Not connected");
    return;
  }
  const topic=document.getElementById("subtopic").value;
  client.subscribe(topic);
  logMessage("Subscribed: "+topic);
}

function publishMessage(){
  if(!connected){
    alert("Not connected");
    return;
  }
  const topic=document.getElementById("pubtopic").value;
  const msg=document.getElementById("message").value;

  const message=new Paho.MQTT.Message(msg);
  message.destinationName=topic;
  client.send(message);

  logMessage("TX: "+msg);
}

document.addEventListener("DOMContentLoaded",function(){
  setTimeout(connectMQTT,1000);
  setTimeout(subscribeTopic,5000);
});

</script>
