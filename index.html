<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQTT WebSocket Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

<style>
:root{
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --bg:#f1f5f9;
}

body{
  font-family: system-ui, sans-serif;
  background: var(--bg);
  margin:0;
  padding:30px 15px;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:800px;
}

h2{
  margin-top:0;
  text-align:center;
}

.card{
  background:#fff;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
  margin-bottom:15px;
  overflow:hidden;
}

.card-header{
  background:var(--primary);
  color:#fff;
  padding:12px;
  font-weight:600;
}

.card-content{
  padding:15px;
}

input, button{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border-radius:6px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  background:var(--primary);
  color:white;
  border:none;
  cursor:pointer;
  font-weight:600;
}

button:hover{
  opacity:.9;
}

#status{
  padding:12px;
  border-radius:8px;
  font-weight:600;
  margin-bottom:15px;
  background:var(--danger);
  color:#fff;
  text-align:center;
}

#messages{
  background:#111;
  color:#0f0;
  padding:10px;
  height:240px;
  overflow-y:auto;
  font-family:monospace;
  border-radius:8px;
  font-size:14px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.log-item{
  border-bottom:1px solid rgba(0,255,0,.2);
  padding-bottom:4px;
  word-break:break-word;
}
</style>
</head>
<body>

<div class="container">

<h2>MQTT WebSocket Dashboard</h2>

<div id="status">Connecting...</div>

<div class="card">
  <div class="card-header">Publish</div>
  <div class="card-content">
    <input id="pubtopic" placeholder="example/topic">
    <input id="message" placeholder="hello mqtt">
    <button onclick="publishMessage()">Send</button>
  </div>
</div>

<div class="card">
  <div class="card-header">Messages</div>
  <div class="card-content">
    <button onclick="clearLog()">Clear Messages</button>
    <div id="messages"></div>
  </div>
</div>

</div>

<script>
const $ = id => document.getElementById(id);
let client = null;
let connected = false;

const BROKER = "broker.emqx.io";
const PORT = 8084;
const PATH = "/mqtt";

/* Log */
function log(text){
  const msgBox = $("messages");
  const time = new Date().toLocaleTimeString();
  const item = document.createElement("div");
  item.className = "log-item";
  item.textContent = `[${time}] ${text}`;
  msgBox.appendChild(item);
  msgBox.scrollTop = msgBox.scrollHeight;
}

/* Status */
function setStatus(text,type){
  const status = $("status");
  status.textContent = text;
  status.style.background =
    type==="success" ? "var(--success)" :
    type==="danger" ? "var(--danger)" :
    "var(--primary)";
}

/* Connect */
function connectMQTT(){

  setStatus("Connecting...","danger");

  const clientID = "web_" + Math.random().toString(16).substr(2,8);

  client = new Paho.MQTT.Client(
    BROKER,
    PORT,
    PATH,
    clientID
  );

  client.onConnectionLost = function(){
    connected=false;
    setStatus("Disconnected - Reconnecting...","danger");
    log("Connection lost");
    setTimeout(connectMQTT,3000);
  };

  client.onMessageArrived = function(message){
    log("Topic: " + message.destinationName + 
        " | " + message.payloadString);
  };

  client.connect({
    useSSL:true,
    timeout:5,
    onSuccess:function(){
      connected=true;
      setStatus("Connected to " + BROKER,"success");
      log("Connected successfully");
    },
    onFailure:function(err){
      setStatus("Connection Failed - Retrying...","danger");
      log("Failed: " + err.errorMessage);
      setTimeout(connectMQTT,3000);
    }
  });
}

/* Publish */
function publishMessage(){
  if(!connected){
    alert("Not connected yet");
    return;
  }

  const topic = $("pubtopic").value;
  const msg = $("message").value;

  const message = new Paho.MQTT.Message(msg);
  message.destinationName = topic;
  client.send(message);

  log("Sent → " + msg);
}

/* Clear */
function clearLog(){
  $("messages").innerHTML="";
}

/* AUTO CONNECT SAAT PAGE LOAD */
window.addEventListener("load",()=>{
  connectMQTT();
});
</script>

</body>
</html>
