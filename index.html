<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP WebSocket Monitor</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        margin-top: 40px;
    }

    .panel {
        width: 95%;
        max-width: 900px;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
    }

    #messages {
        height: 300px;
        border: 1px solid #ccc;
        padding: 10px;
        overflow-y: auto;
        background: #111;
        color: #00ff00;
        font-family: monospace;
        margin-bottom: 15px;
    }

    .msg {
        display: block;
        margin-bottom: 5px;
    }

    button {
        padding: 8px 15px;
        margin-right: 5px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }

    .connect { background-color: #28a745; color: white; }
    .disconnect { background-color: #dc3545; color: white; }
    .clear { background-color: #007bff; color: white; }

</style>
</head>

<body>

<div class="panel">
    <h2>ESP8266 WebSocket Monitor</h2>

    <div id="messages"></div>

    <button class="connect" onclick="connectWebSocket()">Connect</button>
    <button class="disconnect" onclick="disconnectWebSocket()">Disconnect</button>
    <button class="clear" onclick="clearMessages()">Clear Message</button>
</div>

<script>

let socket;
let reconnectInterval = 5000;
let autoReconnect = true;

function addMessage(text) {
    const msgBox = document.getElementById("messages");
    const newMsg = document.createElement("div");
    newMsg.className = "msg";
    newMsg.textContent = text;
    msgBox.appendChild(newMsg);
    msgBox.scrollTop = msgBox.scrollHeight;
}

function connectWebSocket() {

    if (socket && socket.readyState === WebSocket.OPEN) {
        addMessage("Sudah terhubung.");
        return;
    }

    addMessage("Mencoba koneksi...");

    socket = new WebSocket("ws://" + window.location.hostname + ":81/");

    socket.onopen = function() {
        addMessage("Terhubung ke server.");
    };

    socket.onmessage = function(event) {
        addMessage("Diterima: " + event.data);
    };

    socket.onclose = function() {
        addMessage("Koneksi terputus.");
        if (autoReconnect) {
            setTimeout(connectWebSocket, reconnectInterval);
        }
    };

    socket.onerror = function() {
        addMessage("Terjadi error koneksi.");
        socket.close();
    };
}

function disconnectWebSocket() {
    autoReconnect = false;
    if (socket) {
        socket.close();
    }
}

function clearMessages() {
    document.getElementById("messages").innerHTML = "";
}
 
// ===== AUTO CONNECT DENGAN DELAY 5 DETIK =====
window.onload = function() {
    addMessage("Menunggu 5 detik dulu sebelum auto connect...");
    setTimeout(connectWebSocket, 5000);
};

</script>

</body>
</html>
